[project]
name = "bam-faces"
version = "1.0.0"
description = "Estudo experimental de Memória Associativa Bidirecional sobre a base de faces Olivetti"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]
ignore = [
    "E741",  # nomes curtos como `l` não ocorrem; mantido por segurança
    "B905",  # zip(strict=) já é usado onde importa
]

[tool.ruff.lint.per-file-ignores]
# Os experimentos importam `_comum` só pelo efeito colateral de ajustar sys.path.
"experiments/*.py" = ["F401", "E402"]
"tests/*.py" = ["E501"]
